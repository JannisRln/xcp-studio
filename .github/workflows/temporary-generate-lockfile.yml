name: Temporary lockfile generation

on:
  push:
    branches: [chore/T-0001-ci-and-branch-cleanup]

permissions:
  contents: write

jobs:
  generate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/T-0001-ci-and-branch-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve frontend npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to this feature branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Frontend lockfile is already up to date"
            exit 0
          }
          git commit -m "chore(T-0001): commit npm lockfile generated on Windows"
          git push origin HEAD:chore/T-0001-ci-and-branch-cleanup
