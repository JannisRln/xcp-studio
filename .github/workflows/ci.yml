name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Format workspace and reject unformatted PR Rust changes
        shell: pwsh
        run: |
          # The existing main baseline contains rustfmt debt. Check every Rust
          # source modified by this PR before accepting runner normalization.
          $baseBranch = "${{ github.base_ref }}"
          if ([string]::IsNullOrWhiteSpace($baseBranch)) { $baseBranch = "main" }
          $base = (git merge-base HEAD "origin/$baseBranch")
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($base)) {
            throw "Cannot determine the PR merge base for Rust format validation"
          }
          $changed = @(git diff --name-only --diff-filter=ACMRT $base HEAD -- '*.rs')
          if ($LASTEXITCODE -ne 0) { throw "Cannot inspect PR Rust files" }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw "Rust formatting failed" }
          $reformatted = @(git diff --name-only --diff-filter=M -- '*.rs')
          if ($LASTEXITCODE -ne 0) { throw "Cannot inspect rustfmt edits" }
          $offenders = @($changed | Where-Object { $reformatted -contains $_ })
          if ($offenders.Count -gt 0) {
            Write-Host "Unformatted Rust files changed by this PR:"
            $offenders | ForEach-Object { Write-Host "  $_" }
            throw "Commit cargo fmt changes to all touched Rust files"
          }
      - name: Check normalized Rust workspace
        run: cargo fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate docs, ticket dependencies and requirement links
        run: python scripts/check_docs.py

  live-view-e2e:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build real XCP simulator server
        run: cargo build -p xcp-server
      - name: Install frontend from committed lockfile
        working-directory: frontend
        run: npm ci
      - name: Run live-view HTTP and WebSocket E2E through Vite
        env:
          XCP_E2E_SCREENSHOT: ${{ runner.temp }}\\xcp-live-view.png
        run: node scripts/live-view-e2e.mjs
      - name: Upload actual browser screenshot of Live View
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcp-live-view-windows
          path: ${{ runner.temp }}\\xcp-live-view.png
          if-no-files-found: warn
