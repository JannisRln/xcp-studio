name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format Rust workspace in CI runner
        run: cargo fmt --all
      - name: Check formatted Rust workspace
        run: cargo fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify hosted browser simulator bundle
        env:
          VITE_DEMO: '1'
        run: npm run build
      - run: npm test
  docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate docs, ticket dependencies and requirement links
        run: python scripts/check_docs.py

  browser-demo:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Verify opt-in static demo build
        working-directory: frontend
        env:
          VITE_DEMO: '1'
        run: npm run build
      - name: Verify actual Edge Live View charts and controls
        env:
          XCP_E2E_SCREENSHOT: ${{ runner.temp }}\xcp-demo-live.png
        run: node scripts/demo-browser-smoke.mjs
      - name: Upload verified browser UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-live-view
          path: ${{ runner.temp }}\xcp-demo-live.png
          if-no-files-found: warn
