name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check committed Rust formatting (no autoformat)
        run: cargo fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate docs, ticket dependencies and requirement links
        run: python scripts/check_docs.py

  live-view-e2e:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build real XCP simulator server
        run: cargo build -p xcp-server
      - name: Install frontend from committed lockfile
        working-directory: frontend
        run: npm ci
      - name: Run live-view HTTP and WebSocket E2E through Vite
        env:
          XCP_E2E_SCREENSHOT: ${{ runner.temp }}\\xcp-live-view.png
        run: node scripts/live-view-e2e.mjs
      - name: Upload actual browser screenshot of Live View
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcp-live-view-windows
          path: ${{ runner.temp }}\\xcp-live-view.png
          if-no-files-found: warn
